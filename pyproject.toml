[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperl"
version = "0.2.0"
description = "Memory-aware, cross-platform native inference runtime for small-to-mid models on consumer hardware"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Sabbir Hassan Imon", email = "sabbirimon@gmail.com"}]
keywords = ["llm", "inference", "edge-ai", "quantization", "gguf", "vulkan", "metal", "simd"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = [
    "numpy>=1.22.0",
    "psutil>=5.9.0"
]

[project.urls]
Homepage = "https://github.com/sabbirimon/HyperL"
Repository = "https://github.com/sabbirimon/HyperL"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["hyperl"]
