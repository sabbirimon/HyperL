name: HyperL Native CI & Multi-Backend Validation
on: [push, pull_request]

permissions:
  contents: read

jobs:
  native-core-sanitizers:
    name: Native Core & Sanitizers (ASan/UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake with Clang Sanitizers
        run: cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DHYPERL_SANITIZERS=ON -DHYPERL_WARNINGS_AS_ERRORS=ON
      - name: Build All Targets
        run: cmake --build build/sanitizers --parallel $(nproc)
      - name: Run Test Suite
        run: ctest --test-dir build/sanitizers --output-on-failure

  cross-platform-matrix:
    name: Native Core & Python Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python Dependencies
        run: python -m pip install numpy psutil pytest

      - name: Build Native Inference Engine & Kernels
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build --config Release --parallel 4

      - name: Run Native C Kernel Test Suite
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Run Python C-ABI Runtime Tests
        run: |
          python -c "from python.hyperl import runtime; ctx = runtime.Context(); print('Engine Version:', runtime.Context.version())"
          python -c "from python.hyperl import ir; g = ir.Graph(); print('HyperL-IR initialized')"
          python -c "from python.hyperl import gguf_engine; eng = gguf_engine.HyperLInferenceEngine(); print('GGUF Engine ready')"

      - name: Run Inference & Benchmark Verification
        run: python benchmarks/run_benchmarks.py

  gpu-vulkan-validation:
    name: Portable GPU (Vulkan Compute) Runner
    runs-on: ${{ (github.repository == 'sabbirimon/HyperL' && vars.HAS_GPU_RUNNER == 'true') && fromJSON('["self-hosted", "gpu"]') || 'ubuntu-latest' }}
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Vulkan SDK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libvulkan-dev vulkan-tools spirv-tools glslang-tools || true
      - name: Build Vulkan Native Bridge
        run: |
          cmake -S . -B build/vulkan -DCMAKE_BUILD_TYPE=Release
          cmake --build build/vulkan --config Release --parallel 2
      - name: Vulkan Compute Qualification Probe
        run: |
          if [ -x build/vulkan/hyperl_vulkan ]; then
            ./build/vulkan/hyperl_vulkan --probe || true
          fi
