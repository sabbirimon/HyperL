name: Native engine
on: [push, pull_request]
permissions:
  contents: read

jobs:
  native:
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --locked --features gpu --manifest-path engine/Cargo.toml
      - run: cargo test --manifest-path crates/hyperl/Cargo.toml
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release --parallel 4
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - run: python scripts/generate_contract.py --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo build --release --locked --manifest-path engine/Cargo.toml --features gpu
      - name: Exercise desktop controls on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a python studio/test_studio.py
      - name: Exercise desktop controls on macOS and Windows
        if: runner.os != 'Linux'
        run: python studio/test_studio.py
      - name: Assemble portable desktop bundle
        shell: python
        run: |
          import os, pathlib, zipfile
          binary = 'hyperl-engine.exe' if os.name == 'nt' else 'hyperl-engine'
          with zipfile.ZipFile('hyperl-desktop.zip', 'w', zipfile.ZIP_DEFLATED) as bundle:
              for name in [f'engine/target/release/{binary}', 'studio/hyperl_studio.py', 'studio/START.txt', 'LICENSE', 'NOTICE']:
                  bundle.write(name, pathlib.Path(name).name)
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: 'hyperl-desktop.zip'
      - name: Verify published provenance against this build
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for item in hyperl-desktop.zip; do
            gh attestation verify "$item" --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" --source-digest "$GITHUB_SHA"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: hyperl-desktop-${{ runner.os }}-${{ runner.arch }}
          path: hyperl-desktop.zip
          if-no-files-found: error

  sanitizer:
    runs-on: ubuntu-latest
    env:
      CC: clang
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build/sanitizers -DCMAKE_BUILD_TYPE=Debug -DHYPERL_SANITIZERS=ON
      - run: cmake --build build/sanitizers --parallel 4
      - run: ctest --test-dir build/sanitizers --output-on-failure

  compiler:
    runs-on: ubuntu-latest
    env:
      HYPERL_TEST_IREE: '1'
      XLA_FLAGS: --xla_force_host_platform_device_count=4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements/mlir-test.txt
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --parallel 4
      - run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - run: python benchmarks/run_benchmarks.py --device cpu
