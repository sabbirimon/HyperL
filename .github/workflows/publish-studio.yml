name: Publish verified Studio archives
on:
  push:
    branches: [release/studio-downloads]
    paths: ['.github/workflows/publish-studio.yml']
permissions:
  actions: read
  attestations: read
  contents: write
concurrency:
  group: publish-studio-downloads
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SOURCE: 1942f287b805c939be85de4a8765ac8f354ce2e1
      RUN: '45217592942'
      TAG: v0.1.0-alpha.6
    steps:
      - name: Verify all tested packages before publishing
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh run view "$RUN" -R "$REPO" --json conclusion,headSha --jq '[.conclusion,.headSha]|join(" ")')" = "success $SOURCE"
          mkdir assets
          for platform in Windows-X64 Linux-X64 macOS-ARM64; do
            gh run download "$RUN" -R "$REPO" -D "$platform" -n "hyperl-desktop-$platform"
            archive="$platform/hyperl-desktop.zip"
            filename="HyperL-Studio-$platform.zip"
            gh attestation verify "$archive" --repo "$REPO" --signer-workflow "$REPO/.github/workflows/ci.yml" --source-digest "$SOURCE"
            mv "$archive" "assets/$filename"
            rm -r "$platform"
          done
          (cd assets && sha256sum * > SHA256SUMS.txt)
          cat > notes.md <<'NOTES'
          Windows x64: download the Windows ZIP and extract the entire archive before opening HyperL-Studio.exe. The package includes offline inference and the CUDA migration interface.

          Platform archives were tested after extraction. Verify downloads with SHA256SUMS.txt or GitHub artifact attestations. This is a preview build. OS publisher signing and notarization remain outstanding.
          NOTES
          gh release create "$TAG" -R "$REPO" --target "$SOURCE" --prerelease --draft --title "HyperL Studio v0.1.0-alpha.6" --notes-file notes.md assets/*
          gh release edit "$TAG" -R "$REPO" --draft=false
