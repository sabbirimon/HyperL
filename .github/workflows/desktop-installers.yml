name: Desktop preview installers
on:
  push:
    branches: [main, codex/production-library]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Linux package build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fakeroot rpm
      - name: Confirm Windows WiX 3 build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wixBin = Join-Path $env:WIX 'bin'
          if (!(Test-Path (Join-Path $wixBin 'candle.exe'))) { throw 'WiX 3 is required on the build runner' }
          $wixBin >> $env:GITHUB_PATH
      - run: cmake -S . -B build/native -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/native --config Release
      - run: ctest --test-dir build/native -C Release --output-on-failure
      - name: Test and prepare portable payload
        shell: bash
        run: ./gradlew --no-daemon test installDist distZip distTar
      - name: Package and smoke-test bundled runtime
        shell: bash
        run: python scripts/package_desktop.py --distribution build/install/hyperl --native build/native --output build/desktop --jdk "$JAVA_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          if-no-files-found: error
          path: |
            build/desktop/*.dmg
            build/desktop/*.msi
            build/desktop/*.deb
            build/desktop/*.rpm
            build/desktop/SHA256SUMS
            build/desktop/packaging-report.json
            build/distributions/*.zip
            build/distributions/*.tar
  publish-preview:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-alpha.')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-inputs
      - name: Verify target reports and collect release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_RUN: ${{ github.run_id }}
        run: |
          python3 scripts/collect_desktop_release.py --inputs release-inputs --output release-assets --version "${RELEASE_TAG#v}" --run "$RELEASE_RUN"
          python3 - <<'PYTHON'
          from pathlib import Path
          import os
          version=os.environ['RELEASE_TAG'].removeprefix('v')
          run=os.environ['RELEASE_RUN']
          Path('preview-release.md').write_text(f"HyperL {version} desktop installer previews: Intel/Apple Silicon Mac DMG, Windows x64 MSI, Linux x64 DEB/RPM. Java 21 is bundled; use HyperL for GUI and hyperl-cli for commands. Portable ZIP/TAR require Java 17+.\n\nAll four target builds and bundled-runtime CPU checks pass. SHA256SUMS and desktop-validation.json record the exact five native assets. Build: https://github.com/sabbirimon/HyperL/actions/runs/{run}\n\nPublisher-unsigned, unnotarized alpha previews. Interactive install/upgrade/uninstall, native GUI acceptance, signing, security review and broader GPU/model/cluster qualification remain open. Native installer metadata does not imply production readiness. See DESKTOP_INSTALLERS.md and USE_CASES.md for setup, twelve recipes and exact boundaries. Source builds should checkout v{version}.\n")
          PYTHON
      - name: Publish new prerelease without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-assets/* --verify-tag --prerelease --title "HyperL $RELEASE_TAG — desktop installer previews" --notes-file preview-release.md
