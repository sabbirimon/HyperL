<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc"><title id="title">AMD partial offload measurement</title><desc id="desc">Short Qwen2.5 probe: CPU decode 11.23 tokens per second; experimental AMD four-layer offload 0.75. CPU remains default.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs><rect width="1120" height="430" rx="24" fill="#0b1220"/><g font-family="Arial, Helvetica, sans-serif"><text x="40" y="52" font-size="28" fill="#f8fafc" font-weight="bold">MEASURED PARTIAL-OFFLOAD PROTOTYPE</text><text x="40" y="84" font-size="18" fill="#94a3b8" font-weight="normal">Qwen2.5 1.5B · Intel i9 / Radeon Pro 560X · 8 generated tokens · single short probe</text><text x="40" y="172" font-size="21" fill="#38bdf8" font-weight="bold">CPU</text><rect x="260" y="145" width="720" height="42" rx="9" fill="#1e293b"/><rect x="260" y="145" width="673.8" height="42" rx="9" fill="#38bdf8"/><text x="995" y="173" font-size="22" fill="#38bdf8" font-weight="bold">11.23</text><text x="40" y="262" font-size="21" fill="#fb923c" font-weight="bold">AMD · 4 layers</text><rect x="260" y="235" width="720" height="42" rx="9" fill="#1e293b"/><rect x="260" y="235" width="45.0" height="42" rx="9" fill="#fb923c"/><text x="995" y="263" font-size="22" fill="#fb923c" font-weight="bold">0.75</text><text x="260" y="315" font-size="18" fill="#94a3b8" font-weight="normal">Decode tokens / second · higher is faster</text><text x="40" y="359" font-size="18" fill="#e2e8f0" font-weight="normal">11 numerical cases passed; short text matched. Prototype used ~885 MiB GPU memory.</text><text x="40" y="391" font-size="17" fill="#94a3b8" font-weight="normal">The slower experimental path is not promoted. These samples are not a general performance benchmark.</text></g></svg>